name: Refresh gh-ascii card

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
         
      - uses: actions/checkout@v4

      - name: Download light theme
        env:
          HANDLE: parasmanimishra-stack
          GH_ASCII_URL: https://gh.crafter.run
        run: |
          curl -fsSL --retry 3 --retry-delay 5 \
            "$GH_ASCII_URL/$HANDLE?theme=light" \
            -o light_mode.svg

      - name: Commit only if the card changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add light_mode.svg

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: refresh light mode card"
            git push
          fi
